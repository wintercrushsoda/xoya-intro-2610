  <script>window.PAGES = {};

window.APP = {
  page: null
};

function toRoute(link) {
  if (!link) return "#";
  var m = String(link).match(/^(?:\.\/)?(index|oc|pair|owner|guest)\.html(?:#(.*))?$/);
  if (!m) return link;
  if (m[1] === "index") return "#";
  return "#" + m[1] + (m[2] ? "/" + m[2] : "");
}

window.THEME = function() {
  var KEYS = {
    point: "--point",
    title: "--t-title",
    text: "--t-text",
    sub: "--t-sub",
    line: "--t-line",
    soft: "--t-soft",
    accent: "--t-accent",
    accentText: "--t-on-accent",
    card: "--t-card",
    background: "--page-bg"
  };
  var PG = ((window.SITE || {}).colors || {}).pages || {};
  function base(name) {
    return [ PG.all || PG, PG[name] || {} ];
  }
  function apply(el) {
    var m = {};
    for (var i = 1; i < arguments.length; i++) {
      var o = arguments[i];
      if (!o) continue;
      if (Array.isArray(o)) {
        o.forEach((function(x) {
          for (var k in x) if (x[k] && KEYS[k]) m[k] = x[k];
        }));
        continue;
      }
      for (var k in o) if (o[k] && KEYS[k]) m[k] = o[k];
    }
    for (var key in KEYS) {
      if (m[key]) el.style.setProperty(KEYS[key], m[key]); else el.style.removeProperty(KEYS[key]);
    }
  }
  function of(d) {
    if (!d) return null;
    var t = {}, k;
    if (d.theme) for (k in d.theme) t[k] = d.theme[k];
    if (d.color) t.point = d.color;
    return t;
  }
  return {
    apply: apply,
    base: base,
    of: of
  };
}();

window.COPY = function(text, done) {
  done = done || function() {};
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try {
      ok = document.execCommand("copy");
    } catch (e) {}
    document.body.removeChild(ta);
    done(ok);
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then((function() {
      done(true);
    }), fallback);
  } else fallback();
};

window.TOAST = function() {
  var timer = null;
  return function(msg) {
    var t = document.getElementById("gToast");
    t.textContent = msg;
    t.classList.add("is-on");
    clearTimeout(timer);
    timer = setTimeout((function() {
      t.classList.remove("is-on");
    }), 2200);
  };
}();

window.LB = function() {
  function $(id) {
    return document.getElementById(id);
  }
  var items = [], idx = 0;
  function show(i) {
    idx = (i + items.length) % items.length;
    var it = items[idx], img = $("lbImg");
    img.classList.remove("is-in");
    void img.offsetWidth;
    img.src = it.image;
    img.alt = it.caption || "";
    img.classList.add("is-in");
    $("lbCap").textContent = it.caption || "";
    $("lbCount").textContent = idx + 1 + " / " + items.length;
    $("lbPrev").hidden = $("lbNext").hidden = items.length < 2;
  }
  function open(list, i) {
    items = list;
    $("lb").hidden = false;
    show(i);
  }
  function close() {
    $("lb").hidden = true;
    $("lbImg").src = "";
  }
  $("lbClose").onclick = close;
  $("lbPrev").onclick = function() {
    show(idx - 1);
  };
  $("lbNext").onclick = function() {
    show(idx + 1);
  };
  $("lb").addEventListener("click", (function(e) {
    if (e.target === this) close();
  }));
  document.addEventListener("keydown", (function(e) {
    if ($("lb").hidden) return;
    if (e.key === "Escape") {
      close();
      e.stopImmediatePropagation();
    }
    if (e.key === "ArrowLeft") show(idx - 1);
    if (e.key === "ArrowRight") show(idx + 1);
  }));
  return {
    open: open,
    close: close,
    isOpen: function() {
      return !$("lb").hidden;
    }
  };
}()</script>

  
  <script>(function() {
  var D = window.SITE || {};
  PAGES.home = function() {
    document.title = D.title || "Home";
  };
  var C = D.colors || {}, P = C.player || {};
  var colorMap = {
    "--point": C.point || D.color,
    "--bg": C.background,
    "--bg-top": C.backgroundTop,
    "--logo": C.logo,
    "--menu": C.menuText,
    "--menu-hover": C.menuHover,
    "--menu-num": C.menuNumber,
    "--menu-line": C.menuLine,
    "--frame-bg": C.frameBackground,
    "--frame-border": C.frameBorder,
    "--frame-shadow": C.frameShadow,
    "--ph-bg": C.placeholder,
    "--ph-text": C.placeholderText,
    "--obj-shadow": C.objectShadow,
    "--mp-bg": P.background,
    "--mp-border": P.border,
    "--mp-text": P.title,
    "--mp-sub": P.subText,
    "--mp-btn": P.playButton,
    "--mp-btn-icon": P.playIcon,
    "--mp-bar": P.bar,
    "--mp-bar-empty": P.barEmpty,
    "--mp-disc": P.disc
  };
  var colorVars = {};
  for (var k in colorMap) {
    if (colorMap[k]) {
      colorVars[k] = colorMap[k];
      document.documentElement.style.setProperty(k, colorMap[k]);
    }
  }
  var B = D.bgImage || {};
  var bgEl = document.getElementById("bgImage");
  if (B.image) {
    var type = B.type || "cover";
    bgEl.style.backgroundImage = 'url("' + B.image + '")';
    bgEl.style.backgroundPosition = B.position || "center";
    if (type === "pattern") {
      bgEl.style.backgroundRepeat = "repeat";
      bgEl.style.backgroundSize = (B.patternSize || 200) + "px auto";
      bgEl.style.setProperty("--tile", (B.patternSize || 200) + "px");
    } else {
      bgEl.style.backgroundRepeat = "no-repeat";
      bgEl.style.backgroundSize = type === "contain" ? "contain" : "cover";
    }
    bgEl.style.opacity = B.opacity == null ? .2 : B.opacity;
    var f = [];
    if (B.blur) f.push("blur(" + B.blur + "px)");
    if (B.grayscale) f.push("grayscale(1)");
    if (f.length) {
      bgEl.style.filter = f.join(" ");
      bgEl.style.inset = B.blur ? -B.blur * 2 + "px" : "";
    }
    if (B.scroll) bgEl.classList.add(type === "pattern" ? "is-scroll-tile" : "is-scroll-drift");
    if (B.fadeBottom !== false) document.getElementById("bgFade").classList.add("is-on");
  }
  var logoBox = document.getElementById("logo");
  var logo = D.logo || {};
  if (logo.image) {
    var lImg = document.createElement("img");
    lImg.src = logo.image;
    lImg.alt = (logo.text || "logo").replace(/\n/g, " ");
    lImg.style.width = (logo.size || 300) + "px";
    logoBox.appendChild(lImg);
  } else {
    var lTxt = document.createElement("span");

    logoBox.appendChild(lTxt);
  }
  var illBox = document.getElementById("illust");

  if (ill.size) document.getElementById("pgHome").style.setProperty("--illu-size", ill.size + "px");
  if (ill.frame === false) {
    illBox.classList.add("illust--object");
    if (ill.shadow !== false) illBox.classList.add("illust--shadow");
  } else {
    var shape = {
      rect: 1,

      arch: 1
    }[ill.shape] ? ill.shape : "rect";
    illBox.classList.add("illust--" + shape);
    if (ill.marks !== false && shape === "rect") {
      var mk = document.createElement("span");
      mk.className = "illust-marks";
      illBox.appendChild(mk);
    }
  }
  var iWrap = document.createElement("div");
  iWrap.className = "illust-pic";
  if (ill.image) {
    iWrap.style.setProperty("--illu-img", 'url("' + ill.image + '")');
    var iImg = document.createElement("img");
    iImg.src = ill.image;
    iImg.alt = "main illustration";
    iWrap.appendChild(iImg);
  } else {
    var ph = document.createElement("div");
    ph.className = "illust-placeholder";
    ph.textContent = "MAIN ILLUSTRATION";
    iWrap.appendChild(ph);
  }
  illBox.appendChild(iWrap);
  if (ill.caption && ill.frame !== false) {
    var cap = document.createElement("figcaption");
    cap.className = "illust-cap";
    cap.textContent = ill.caption;
    illBox.appendChild(cap);
  }
  var menuBox = document.getElementById("menu");
  (D.menu || []).filter((function(m) {
    return m && !m.hidden;
  })).forEach((function(m, i) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.className = "menu-item";
    a.href = toRoute(m.link);
    a.style.animationDelay = .5 + i * .08 + "s";
    var num = document.createElement("span");
    num.className = "menu-num";
    num.textContent = (i + 1 < 10 ? "0" : "") + (i + 1);
    var line = document.createElement("span");
    line.className = "menu-line";
    var name = document.createElement("span");
    name.className = "menu-name";
    name.textContent = m.name || "";
    a.appendChild(num);
    a.appendChild(line);
    a.appendChild(name);
    li.appendChild(a);
    menuBox.appendChild(li);
  }));
  var stage = document.getElementById("stage");
  var W = 1600, H = 1e3;
  var MOBILE_MAX = D.mobileWidth || 820;
  var MS = parseFloat(D.mobileScale);
  if (MS > .5 && MS < 1.5) document.documentElement.style.setProperty("--m-scale", MS);
  function fit() {

    stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";

  window.addEventListener("resize", fit);
  fit();
  if ((D.calendar || {}).enable !== false) {

function Calendar(root, cfg) {
  var WEEK = cfg.weekStart === 1 ? [ "월", "화", "수", "목", "금", "토", "일" ] : [ "일", "월", "화", "수", "목", "금", "토" ];
  var start = cfg.weekStart === 1 ? 1 : 0;
  var today = new Date;
  today.setHours(0, 0, 0, 0);
  var view = new Date(today.getFullYear(), today.getMonth(), 1);
  var selected = null;
  function pad(n) {
    return (n < 10 ? "0" : "") + n;
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  var EVENTS = (cfg.events || []).map((function(e) {
    var p = String(e.date || "").split("-").map(Number), o = {
      title: e.title || "",
      raw: e
    };
    if (p.length === 2) {
      o.m = p[0];
      o.d = p[1];
      o.yearly = true;
    } else if (p.length === 3) {
      o.y = p[0];
      o.m = p[1];
      o.d = p[2];
      o.yearly = !!e.yearly;
    }
    return o;
  })).filter((function(o) {
    return o.m && o.d;
  }));
  function eventsOn(y, m, d) {
    return EVENTS.filter((function(e) {
      if (e.m !== m || e.d !== d) return false;
      if (e.yearly) return !e.y || y >= e.y;
      return e.y === y;
    })).map((function(e) {
      var label = e.title;
      if (e.yearly && e.y && y > e.y) label += " (" + (y - e.y) + "주년)";
      return label;
    }));
  }
  function upcoming(limit) {
    var list = [];
    for (var i = 0; i <= 366 && list.length < limit; i++) {
      var dt = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
      eventsOn(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()).forEach((function(t) {
        if (list.length < limit) list.push({
          days: i,
          title: t,
          date: dt
        });
      }));
    }
    return list;
  }
  var pos = cfg.position || "right-top";
  root.className = "mp cal cal--" + pos;
  root.innerHTML = '<div class="mp-head">' + '<span class="mp-label">' + (cfg.label || "CALENDAR") + "</span>" + '<div class="mp-hbtns"><button class="mp-icon" data-act="fold" title="접기 / 닫기">' + '<svg viewBox="0 0 24 24" class="line ci-fold"><path d="M6 12h12"/></svg>' + '<svg viewBox="0 0 24 24" class="line ci-close"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>' + "</div>" + '<div class="cal-body">' + '<div class="cal-month">' + '<button class="cal-title" data-act="today" title="이번 달로">' + '<b class="cal-mm"></b><span class="cal-my"><em></em><i></i></span>' + "</button>" + '<div class="cal-nav">' + '<button class="mp-icon" data-act="prev" title="이전 달"><svg viewBox="0 0 24 24" class="line"><path d="M15 6l-6 6 6 6"/></svg></button>' + '<button class="mp-icon" data-act="next" title="다음 달"><svg viewBox="0 0 24 24" class="line"><path d="M9 6l6 6-6 6"/></svg></button>' + "</div>" + "</div>" + '<div class="cal-week"></div>' + '<div class="cal-grid"></div>' + "</div>" + '<div class="cal-foot"></div>';
  var q = function(s) {
    return root.querySelector(s);
  };
  var weekRow = q(".cal-week");
  WEEK.forEach((function(w, i) {
    var c = el("span", "", w);
    var real = (i + start) % 7;
    if (real === 0) c.className = "is-sun";
    if (real === 6) c.className = "is-sat";
    weekRow.appendChild(c);
  }));
  function render(animate) {
    var y = view.getFullYear(), m = view.getMonth();
    var MONTHS = [ "January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December" ];
    q(".cal-mm").textContent = pad(m + 1);
    q(".cal-my em").textContent = MONTHS[m];
    q(".cal-my i").textContent = y;
    q(".cal-title").classList.toggle("is-now", y === today.getFullYear() && m === today.getMonth());
    var grid = q(".cal-grid");
    grid.innerHTML = "";
    if (animate) {
